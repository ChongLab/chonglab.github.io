<div class="album-page">

  {% for item in site.data.album %}
    <figure class="album-item">
      <img src="{{ item.photo | relative_url }}" alt="{{ item.description }}" />
      <figcaption>{{ item.description }}</figcaption>
    </figure>
  {% endfor %}
</div>
