- tag: Inspector_protocol
  name: Inspector_protocol
  description: Example workflows for evaluating long-read genome assemblies with Inspector.
  github: https://github.com/ChongLab/Inspector_protocol

- tag: Inspector
  name: Inspector
  description: A reference-free assembly evaluator.
  github: https://github.com/ChongLab/Inspector

- tag: FusionSeeker
  name: FusionSeeker
  description: A gene-fusion caller for long-read single-molecule sequencing data.
  github: https://github.com/ChongLab/FusionSeeker

- tag: DeBreak
  name: DeBreak
  description: A structural-variant caller for long-read single-molecule sequencing data.
  github: https://github.com/ChongLab/DeBreak

- tag: B-assembler
  name: B-assembler
  description: A Snakemake-based pipeline for assembling bacterial genomes from Oxford Nanopore, PacBio, or hybrid long- and short-read data.
  github: https://github.com/ChongLab/B-assembler

- tag: ClipSV
  name: ClipSV
  description: ClipSV is a method for structural-variant detection based on read extension, spliced alignment, and local assembly.
  github: https://github.com/ChongLab/ClipSV

- tag: MRLR
  name: MRLR
  description: MRLR is a pipeline for identifying meiotic recombination events in trios using whole-genome 10X Genomics sequencing data.
  github: https://github.com/ChongLab/MRLR

- tag: novoBreak
  name: novoBreak
  description: A local-assembly method for detecting somatic and germline structural-variant breakpoints in Illumina paired-end sequencing data.
  github: https://github.com/ChongLab/nb_distribution

- tag: rainbow
  name: rainbow
  description: The Rainbow package consists of several programs for RAD-seq-related clustering and de novo assembly.
  github: https://github.com/ChongLab/rainbow

